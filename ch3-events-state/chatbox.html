<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function ChatInput() {
            return (
                <>
                    <input type="text" placeholder="Type here"></input>
                    <button>send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) {
            return (
                <div>
                    {sender === "robot" && (<img src="../ch-2-components-props/robot.png" width="50" />)}
                    {message}
                    {sender === "user" && (<img src="../ch-2-components-props/user.png" width="50" />)}
                </div>
            );
        }

        function ChatMessages() {
            const chatMessages = [{ "message": "hi", "sender": "user", "id": "1" },
            { "message": "yes", "sender": "robot", "id": "2" },
            { "message": "tell me time", "sender": "user", "id": "3" },
            { "message": "1 PM", "sender": "robot", "id": "4" },
            ];

            return (

                chatMessages.map((chatMessage) => {

                    return (
                        <ChatMessage
                            message={chatMessage.message}
                            sender={chatMessage.sender}
                            key={chatMessage.id}
                        />
                    );

                }

                )

            );
        }

        function App() {

            return (

                <>
                    <ChatInput />

                    <ChatMessages />
                </>

            );
        }

        const container = document.querySelector('.js-container');

        ReactDOM.createRoot(container).render(<App />);

    </script>



</body>



</html>
